services:
  hinttalk:
    build:
      context: .
      dockerfile: Dockerfile
    image: hinttalk:latest
    container_name: hinttalk
    ports:
      - "${HINTTALK_PORT:-21079}:21079"
    environment:
      PORT: "21079"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:21079/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
