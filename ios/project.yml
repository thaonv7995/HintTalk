name: HintTalk
options:
  bundleIdPrefix: app.hinttalk
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: true
targets:
  HintTalk:
    type: application
    platform: iOS
    sources:
      - path: HintTalk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hinttalk.ios
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: minimal
    info:
      path: HintTalk/Info.plist
      properties:
        CFBundleDisplayName: HintTalk
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        NSMicrophoneUsageDescription: HintTalk uses the microphone for live English role-play conversations and shadowing practice.
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
